<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protected Dashboard | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f172a;color:white;font-family:Poppins,sans-serif}
.card{width:min(100%,600px);padding:36px;border-radius:18px;background:#1e293b;border:1px solid #334155;box-shadow:0 20px 60px #0005}
h1{color:#38bdf8}p{overflow-wrap:anywhere;color:#cbd5e1;line-height:1.7}
button,a{display:inline-block;margin:10px 8px 0 0;padding:12px 20px;border-radius:24px;border:1px solid #38bdf8;background:#38bdf8;color:#0f172a;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
a{background:transparent;color:#38bdf8}#dashboard-content[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <p id="loading">Checking your account and MFA status...</p>
  <section id="dashboard-content" hidden>
    <h1>Welcome to your dashboard</h1>
    <p>Your account and second factor have been verified.</p>
    <p><strong>Email:</strong> <span id="user-email"></span></p>
    <p><strong>User ID:</strong> <span id="user-id"></span></p>
    <p><strong>MFA status:</strong> Verified (AAL2)</p>
    <a href="index.html">Return to portfolio</a>
    <button id="dashboard-logout">Logout</button>
  </section>
  <p id="dashboard-error" role="alert"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
